<!doctype html><html><head><title>Login - MedTrack</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="card"><h2>MedTrack Login</h2>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="msg">{{m}}</p>{% endfor %}{% endwith %}<form method="post"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form><a href="{{ url_for('register') }}">Create account</a></div></body></html>
